# One file per pilot / production area. The pipeline takes an area name: python -m critical_buildings run --area suffolk
area: suffolk
name: Suffolk
description: Pilot area - the ceremonial county of Suffolk, England.

# OpenStreetMap boundary relation used to clip every source. Pin by government code, not by name:
# a name-only query also matches Suffolk, Virginia.
osm_boundary:
  ref_gss: E10000029
  admin_level: 6

# OS Open Map Local 100 km grid squares that cover the area (OS downloads are per square)
os_grid_squares: [tl, tm, tg]

crs: 27700        # British National Grid - all processing happens in this CRS
