[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "critical-buildings"
version = "0.1.0"
description = "Combines OpenStreetMap, OS Open Map Local and authoritative registers (DfE, CQC, NHS ODS) into a critical buildings dataset."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pandas>=3.0",
    "numpy>=2.0",
    "geopandas>=1.0",
    "pyogrio>=0.10",
    "shapely>=2.0",
    "pyproj>=3.6",
    "pyarrow>=15",
    "openpyxl>=3.1",
    "python-calamine>=0.2",
    "requests>=2.31",
    "folium>=0.17",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
ui = ["streamlit>=1.40"]
dev = ["pytest>=8", "ruff", "vulture"]

[project.scripts]
critical-buildings = "critical_buildings.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:faulthandler"
markers = ["slow: end-to-end regression on the real bronze data (about a minute); deselect with -m \"not slow\""]

[tool.ruff.lint]
# E/F: errors and unused names; I: import order; DTZ: naive datetimes (local time is deliberate here and marked with
# noqa); BLE: blind excepts (also marked); B: likely bugs (zip lengths must be stated, unused loop variables); UP: outdated
# syntax; C4/SIM/PIE/RET: needless comprehensions, nesting and returns. Long lines are allowed: the code keeps related
# arguments together.
select = ["E", "F", "I", "DTZ", "BLE", "B", "UP", "C4", "SIM", "PIE", "RET"]
ignore = ["E501"]
