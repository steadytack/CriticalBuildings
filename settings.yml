# Settings: technical thresholds, areas and the source catalogue in one file.
# Pipeline settings: every threshold the matching, grouping and scoring logic uses.
# Business rules (what counts as a fire station, importance, priorities) are NOT here: they live in the governed
# control store (python -m critical_buildings ui). These are technical tuning values; change them deliberately and
# record why in your commit message - they alter the output. `python -m critical_buildings check` validates this file.

product:                                    # wording used by the UI and CLI, so the shell is not hard-wired to one dataset
  name: Critical Buildings
  entity: building                          # what one row of the main output is
  id_column: Building ID
  area_label: Area

pipeline:                                   # the stages of a run, in order; the UI draws these and shows what each did
  stages:
    - id: fetch
      label: Fetch sources
      layer: bronze
      description: Download each source into a new dated snapshot (only stored if the data changed). Run separately with `fetch`.
    - id: silver
      label: Clean and classify
      layer: silver
      function: critical_buildings.pipeline:silver_stage
      description: Clip to the area, apply the rules to OSM and OS features, load and map the registers. Cached by input hash.
    - id: gold
      label: Match, group, identify
      layer: gold
      function: critical_buildings.pipeline:gold_stage
      description: Merge OS and OSM, group buildings into sites, check against the registers, assign stable IDs and roles, score quality.
    - id: publish
      label: Write deliverables
      layer: gold
      function: critical_buildings.pipeline:publish_stage
      description: Write the files, report, data dictionary and lineage into this run's folder.

matching:                                   # shared by merge, sites and reference matching
  # Categories where OS and OSM name the sub-types differently (e.g. 'Primary Education' vs school=primary), so a
  # match only needs the same category. In every other category the building type must also agree.
  loose_categories: [Education]

merge:                                      # OS building <-> OSM feature
  point_distance_m: 25                      # OS and OSM features this close (metres) may be the same building
  overlap_fraction: 0.3                     # share of the OS polygon an OSM polygon must cover to count as overlap
  name_agree: 0.6                           # OS and OSM names this similar make a proximity-only match trustworthy
  point_distance_by_type:                   # large or sparsely mapped types get a wider proximity match
    Railway Station: 100

sites:                                      # grouping buildings into sites
  cluster_gap_m: 30                         # same-type buildings this close form a proximity cluster
  attach_m: 30                              # a same-named building this close to a site outline joins that site
  merge_overlap: 0.5                        # OS and OSM site polygons overlapping this much are one site

reference_match:                            # DfE / CQC / NHS ODS records <-> sites
  compatible_pairs:                         # building types that may match each other (names differ between sources)
    - [Care Home, Assisted Living Facilities]
    - [Care Home, Mental health facilities]
    - [GP Surgery, Clinics offering Medical Treatment]
    - [Hospital, Clinics offering Medical Treatment]
    - [Mental health facilities, Clinics offering Medical Treatment]
    - [Hospital, Mental health facilities]
  max_distance_m: 2000                      # furthest a register point may be from a site and still be considered
  close_m: 50                               # 'on top of the site': the name need only be roughly similar
  close_min_name: 0.2
  mid_m: 150                                # up to this distance the name must be a good match ...
  mid_min_name: 0.6
  far_name_limit_m: 500                     # ... up to this distance almost identical ...
  far_min_name: 0.95
  far_exact_m: 2000                         # ... and an identical full name + type is accepted even this far
  conflict_m: 100                           # a same-named record of a different type this close reclassifies the site
  postcode_agree_m: 200                     # a location this close to the register's postcode agrees with it
  postcode_far_m: 300                       # and one this far from it disagrees
  location_review_m: 500                    # a matched site this far from its register point goes to review
  snap_m: 20                                # register points snap to a building footprint this close
  sole_exact_m: 100                         # one same-type site within this distance is accepted whatever its name
  not_covered: [Nursery & Child Care]       # DfE only lists maintained nurseries, so private ones cannot be verified
  school_types: [Primary School, Secondary School, School, School For Special Needs, Nursery & Child Care]
  stop_words: [the, school, primary, secondary, infant, junior, nursery, academy, church, england, of, c, e, ce, cofe,
               voluntary, controlled, aided, community, college, hospital, care, home, centre, center, surgery,
               medical, practice, health, house, lodge, and, a, an, at, in, for, ltd, limited, cic, trust, unit,
               clinic, infants, juniors]

quality:                                    # data quality score (0-100), documented in the data dictionary
  verification_points: {Verified: 40, Verified (manual): 40, Authoritative only: 40, Not covered: 20, Unverified: 10, Closed per register: 0}
  source_points: {Both: 25, OSM: 12, OS Important Buildings: 12}
  register_points: 20                       # records that come from a register (DfE / CQC / NHS ODS)
  confidence_points: {High: 20, Medium: 12, Low: 5}
  polygon_points: 15
  point_points: 5
  open_review_penalty: -10
  band_high_min: 75
  band_medium_min: 50

retention:                                  # used by `archive` (dry-run by default). Release-pinned items are never touched.
  bronze_keep: 3                            # latest snapshots kept per source
  silver_keep: 2                            # latest silver builds kept per area
  gold_keep: 5                              # latest gold runs kept per area
  dev_run_days: 14                          # dev runs older than this are eligible for pruning

# ---- Areas: one entry per pilot/production area. `python -m critical_buildings run --area suffolk`
areas:
  suffolk:
    name: Suffolk
    description: Pilot area - the ceremonial county of Suffolk, England.

    # OpenStreetMap boundary relation used to clip every source. Pin by government code, not by name:
    # a name-only query also matches Suffolk, Virginia.
    osm_boundary:
      ref_gss: E10000029
      admin_level: 6

    # OS Open Map Local 100 km grid squares that cover the area (OS downloads are per square)
    os_grid_squares: [tl, tm, tg]

    crs: 27700        # British National Grid - all processing happens in this CRS

# ---- Source catalogue: every external dataset. Licence/attribution are copied into each bronze manifest and the
# published ATTRIBUTION.txt. To add a source: add an entry, a fetcher in sources.py, and a silver reader.
sources:

  osm_overpass:
    name: OpenStreetMap (Overpass API)
    kind: api
    area_scoped: true            # one snapshot series per area: osm_overpass__<area>
    url: https://overpass-api.de/api/interpreter
    licence: Open Database Licence (ODbL) 1.0
    attribution: "(c) OpenStreetMap contributors"
    uses: Tagged features (amenities, healthcare, emergency ...) and buildings inside port/military/aerodrome areas
    refresh: monthly
    owner: data engineering

  os_open_map_local:
    name: OS Open Map Local
    kind: download
    url: "https://api.os.uk/downloads/v1/products/OpenMapLocal/downloads?area={tile}&format=ESRI%C2%AE+Shapefile&redirect"
    licence: Open Government Licence v3.0
    attribution: Contains OS data (c) Crown copyright and database right 2026
    uses: ImportantBuilding, FunctionalSite, RailwayStation and Building layers by 100 km grid square
    refresh: six-monthly (OS release cycle)
    owner: data engineering

  os_codepoint_open:
    name: OS Code-Point Open
    kind: download
    url: "https://api.os.uk/downloads/v1/products/CodePointOpen/downloads?area=GB&format=CSV&redirect"
    licence: Open Government Licence v3.0
    attribution: >-
      Contains OS data (c) Crown copyright and database right 2026; contains Royal Mail data (c) Royal Mail copyright
      and database right 2026; contains National Statistics data (c) Crown copyright and database right 2026
    uses: Postcode to coordinates (NHS ODS sites; register location checks)
    refresh: quarterly
    owner: data engineering

  dfe_gias:
    name: DfE Get Information About Schools
    kind: download
    url: "https://ea-edubase-api-prod.azurewebsites.net/edubase/downloads/public/edubasealldata{yyyymmdd}.csv"
    licence: Open Government Licence v3.0
    attribution: >-
      Contains public sector information licensed under the Open Government Licence v3.0.
      Source: Department for Education
    uses: Open schools, phase, pupil numbers, location
    refresh: monthly
    owner: data steward

  cqc_hsca:
    name: CQC HSCA active locations
    kind: download
    page: https://www.cqc.org.uk/about-us/transparency/using-cqc-data      # the file link changes every month
    link_pattern: "HSCA_Active_Locations\\.ods"
    licence: Open Government Licence v3.0
    attribution: >-
      Contains public sector information licensed under the Open Government Licence v3.0.
      Source: Care Quality Commission
    uses: Care homes, hospices, hospitals, GPs, clinics - beds, rating, UPRN, location
    refresh: monthly
    owner: data steward

  nhs_ods:
    name: NHS Organisation Data Service
    kind: download
    url: "https://www.odsdatasearchandexport.nhs.uk/api/getReport?report={report}"
    reports: [ets, etr, epraccur]
    licence: Open Government Licence v3.0
    attribution: >-
      Contains public sector information licensed under the Open Government Licence v3.0.
      Source: NHS England Organisation Data Service
    uses: Trust sites, trusts and GP practices - ODS codes, status, parent trust
    refresh: monthly
    owner: data steward
